{% extends 'base.html' %}

{% block content %}
  <p class="p-2">Seleccionaste a</p>

  <div class="col-sm-6 col-md-4 col-lg-3 mb-4">
    <div class="card text-center" style="height: 100%;">
      {% if p.image %}
        <img src="{{ p.image.url }}" class="card-img-top mx-auto mt-2" alt="{{ p.nombre }}" style="height: 200px; object-fit: contain;" />
      {% elif p.imagen %}
        <img src="{{ p.imagen }}" class="card-img-top mx-auto mt-2" alt="{{ p.nombre }}" style="height: 200px; object-fit: contain;" />
      {% endif %}

      <div class="card-body p-2">
        <h6 class="card-title mb-2">{{ p.nombre }}</h6>
        <small class="text-muted d-block mb-1">Tipo: {{ p.tipo }}</small>
        <small class="text-muted d-block mb-1">Peso: {{ p.peso }}</small>
        <small class="text-muted d-block mb-1">Altura: {{ p.altura }}</small>
      </div>
    </div>
  </div>
{% endblock %}
